name: .NET CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: stocknet
          POSTGRES_USER: stocknet
          POSTGRES_PASSWORD: stocknet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stocknet -d stocknet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__StockNet: Host=localhost;Port=5432;Database=stocknet;Username=stocknet;Password=stocknet
      Jwt__SigningKey: StockNet-CI-signing-key-with-more-than-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore local tools
        run: dotnet tool restore
      - name: Restore packages
        run: dotnet restore StockNet.slnx
      - name: Build
        run: dotnet build StockNet.slnx --configuration Release --no-restore
      - name: Apply migrations
        run: dotnet ef database update --project src/StockNet.Api/StockNet.Api.csproj --startup-project src/StockNet.Api/StockNet.Api.csproj
      - name: Run integration tests
        run: dotnet test StockNet.slnx --configuration Release --no-build --logger "console;verbosity=minimal"
