services:
  db:
    build:
      context: ./docker
      dockerfile: Dockerfile.postgis
    container_name: stocknet-postgis
    environment:
      POSTGRES_USER: stocknet
      POSTGRES_PASSWORD: stocknet
      POSTGRES_DB: stocknet
    ports:
      - "5432:5432"
    volumes:
      - stocknet-pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d

volumes:
  stocknet-pgdata:
