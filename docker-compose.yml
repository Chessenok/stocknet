services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: stocknet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stocknet}
      POSTGRES_USER: ${POSTGRES_USER:-stocknet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocknet_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - stocknet-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  stocknet-postgres-data:
